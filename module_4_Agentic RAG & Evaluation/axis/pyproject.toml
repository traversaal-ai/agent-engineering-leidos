[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axis"
version = "0.1.0"
description = "A teaching platform comparing Naive RAG and Agentic RAG on cost, latency, and quality"
requires-python = ">=3.12"

# Kept deliberately small. The provider adapters are written against raw `httpx`
# rather than vendor SDKs (see ai_backend/providers/), so the engineering
# foundation installs and tests fully offline, and one `respx` mock covers every
# adapter identically.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Milestone 0 — vector retrieval for Naive RAG / Agentic RAG.
vector = ["chromadb>=0.5"]
# Milestone 0 — the shared multi-format parser (System Design Section 8).
#
# Deliberately NOT PyMuPDF/fitz, despite it being faster at PDF text extraction:
# it is AGPL, and PRD Section 4 explicitly invites students to fork this
# repository and reuse the pattern in their own work. Every library here is
# permissively licensed — pypdf (BSD), python-pptx (MIT), openpyxl (MIT),
# Pillow (HPND) — so nothing a student copies out carries a copyleft obligation
# they did not ask for.
parsers = [
    "pypdf>=4.2",
    "python-pptx>=0.6.23",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "Pillow>=10.3",
    "PyYAML>=6.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
axis = "axis.__main__:main"

[tool.setuptools]
# Three top-level packages, one per layer, plus the composition root.
packages = [
    "axis",
    "frontend",
    "backend",
    "backend.api",
    "backend.api.v1",
    "backend.core",
    "backend.schemas",
    "backend.store",
    "ai_backend",
    "ai_backend.agents",
    "ai_backend.contracts",
    "ai_backend.config",
    "ai_backend.providers",
    "ai_backend.observability",
    "ai_backend.pipelines",
    "ai_backend.retrievers",
    "ai_backend.ingestion",
    "ai_backend.evaluation",
]


# **A wheel install is unsupported, by design — do not "fix" this list.**
#
# `ai_backend` is deliberately absent. Its data would have to be
# `evaluation/golden/questions.yaml` and the demo corpus, and the corpus lives in `data/`
# at the repo root, outside every package, where it can never be package data. Declaring
# the YAML alone would produce a wheel that installs cleanly, finds no corpus, and reports
# "0 indexed" on the demo button — a failure moved later rather than fixed.
#
# The corpus is at the root on purpose: it is a product asset a person edits, not test
# data (see `data/README.md`). So Axis runs from the source tree, which is the only
# install the README documents:
#
#     python -m pip install -e ".[dev,vector,parsers]"
#
# If `pip install axis` should ever work, the corpus needs a home inside a package and
# that decision reverses.
[tool.setuptools.package-data]
frontend = ["templates/*.html", "static/*"]
backend = ["store/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "story(name): the PRD Section 5 user story this test proves",
    "milestone(n): the milestone at which this test is expected to pass; select with --milestone=N",
]

[tool.coverage.run]
source = ["ai_backend", "backend", "frontend"]

[tool.ruff]
target-version = "py312"
line-length = 100
# The course material Axis is built against, vendored for reference and read by
# people rather than run by us: the two notebooks-and-app bundles under `reference/`
# are somebody else's code at somebody else's standards, and 179 findings in them
# made `ruff check .` — the command the README tells you to run — useless as a gate
# on ours. Not excluded because the findings are wrong; excluded because fixing them
# would edit the record of what students were actually shown.
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Inline upload fixtures and canned provider payloads read better on one line
# than wrapped across three. Test data is not production control flow.
"tests/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` / `File(...)` in a parameter default is FastAPI's dependency
# injection idiom, not the mutable-default bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# The contracts package is what students read as a reference (PRD Section 4) and
# what every other layer codes against. It is held to a stricter standard than
# the rest of the tree.
[[tool.mypy.overrides]]
module = "ai_backend.contracts.*"
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
